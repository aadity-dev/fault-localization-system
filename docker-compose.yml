services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: gridfault
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    # ports: ["5432:5432"]  # Commented out to prevent host port conflicts
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d gridfault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # ports: ["6379:6379"]  # Commented out to prevent host port conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/gridfault
      REDIS_URL: redis://redis:6379
      # GEMINI_API_KEY: set this to enable the AI ticket-summary feature.
      # Left unset by default -- the feature degrades gracefully to a
      # deterministic template summary with no API key (see
      # app/services/ai_feature.py). A reviewer running this stack with
      # no key of their own will see template summaries, not an error.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports: ["8501:8501"]
    environment:
      API_BASE: http://backend:8000

volumes:
  pgdata: